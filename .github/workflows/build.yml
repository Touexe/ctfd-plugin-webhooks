name: Build CTFd image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      ctfd_version:
        description: "CTFd image tag"
        default: "latest"
      plugin_ref:
        description: "Plugin branch, tag or commit SHA"
        default: "main"
  schedule:
    - cron: "0 3 * * 1" # weekly rebuild to pick up CTFd base image updates

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CTFD_VERSION=${{ inputs.ctfd_version || 'latest' }}
            PLUGIN_REF=${{ inputs.plugin_ref || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
